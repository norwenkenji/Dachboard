name: ci
on:
  push:
  pull_request:
jobs:
  test:
    # Pinned labels, not `ubuntu-latest`. GitHub migrates `-latest` from 24.04 to
    # 26.04 starting 2026-10-19, and a silent base-image swap under a security
    # project is exactly the kind of change that should arrive in a reviewed
    # commit instead of mid-week. 26.04 runs in the matrix now, so the migration
    # is proven before it is forced; collapse this to a single label once
    # `-latest` has moved and 24.04 stops being the default.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      # v5+ of these actions run on Node 24. v4 targeted the deprecated Node 20,
      # which the runner only kept working by force-running it on 24 and
      # annotating every build about it.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # requirements-dev.txt pulls in requirements.txt plus pytest/httpx/ruff/
      # mypy. Production installs only requirements.txt (deploy/install.sh), so
      # a deployed venv never carries test tooling.
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      # Syntax-check every SPA file: there is no build step and no bundler, so
      # a stray bracket in one of the 11 numbered scripts is otherwise caught
      # only in a browser.
      - run: for f in static/js/*.js; do node --check "$f"; done

  lint:
    # One label is enough here: ruff and mypy are not OS-sensitive (mypy is
    # pinned to platform=linux in pyproject.toml regardless of the runner).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Both are clean as of now; running them keeps them clean. Without this
      # gate the next `except Exception: pass` or untyped list lands silently.
      - run: python -m ruff check .
      - run: python -m mypy
