# --- network ---
host: 127.0.0.1
port: 8420
cookie_secure: true        # set false only for plain-http LAN use
session_ttl_hours: 72

# --- paths ---
secret_file: /opt/dachboard/.secret
db_path: /opt/dachboard/data/dachboard.sqlite3

# --- http hardening ---
# Every response carries a strict CSP, nosniff and frame-ancestors 'none';
# user files are served as forced downloads. See app/security.py.
security:
  hsts: true               # inert over plain HTTP, preloads the upgrade for TLS
  hsts_max_age: 31536000

# --- login throttle ---
# The daemon sits behind nginx, which always appears as 127.0.0.1, so the
# bucket key has to come from X-Forwarded-For. The conf in deploy/nginx/ sets
# it; forwarded_hops is how many proxies sit in front and append to it.
#   nginx only                          -> 1
#   cloudflared/tunnel -> nginx         -> 2
# Set trust_forwarded_for: false ONLY when the panel is reached directly, with
# no proxy — otherwise a client could pick its own bucket.
trust_forwarded_for: true
forwarded_hops: 1

# --- audit trail ---
# Security-relevant events (logins, denials, user/slot/token CRUD, systemctl
# and docker actions, irreversible file deletes, admin cross-slot access) go to
# the stdlib logger "dachboard.audit", which systemd captures in the journal.
# A file is written too, if you want a trail that survives the panel's own
# journal being the thing under investigation. No passwords, tokens or file
# contents are ever logged.
audit:
  file: /opt/dachboard/data/audit.log
  file_enabled: true

# operational log level for the "dachboard" logger (audit is always INFO)
log_level: WARNING

# --- uploads ---
max_upload_mb: 200           # per file via /api/files/upload

# --- tunnel provider ---
# Any executable. First http(s):// URL on its stdout wins.
# Bundled: tunnel/providers/cloudflared-quick.sh [container]
#          tunnel/providers/static.sh <file-with-url>
tunnel:
  provider: tunnel/providers/cloudflared-quick.sh
  args: [dachboard-tunnel]
  cache_seconds: 30
  cache_file: /opt/dachboard/data/tunnel_url.txt

# --- terminal (ttyd) ---
ttyd:
  bin: /usr/local/bin/ttyd
  port_base: 7681          # root shell = base-1, slots take base..base+118
  shell: bash

# --- managed user slots ---
# Slots are created ON DEMAND: name one in the Users tab (or through the
# Telegram bot) and the panel builds it — linux user, home, quota, ttyd unit,
# nginx auth gate — and records its port in the `slots` table.
# The list below is LEGACY only: names here also work and keep their
# index-based port (port_base + index). Leave empty on a new install.
slots: []

# default limits for new users (admin can change per user in UI)
defaults:
  cpu_quota: "50%"
  mem_max: "1G"
  disk_quota: "2G"

# --- isolated slots v2 (docker container per slot). OFF = legacy behavior:
# plain host user + host shell + systemd slice. Turn on only for a test
# slot first (see docs/SLOTS.md).
slots_v2: false
slot_image: "dach-slot:latest"
slot_network: ""   # e.g. "dach-isolated" once P4 lands; empty = default bridge
