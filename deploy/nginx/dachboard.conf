# Dachboard behind one tunnel / one host. Gitea keeps `/`, panel lives at /dash/.
# Tunnel (cloudflared --url http://127.0.0.1:80 or named ingress) points at nginx:80.
# ttyd sessions are loopback-only; nginx gates them via auth_request.

upstream dach_app { server 127.0.0.1:8420; }

server {
    listen 127.0.0.1:80;
    # listen 80;  # uncomment to serve LAN directly (still login-walled)

    # optional: existing gitea on /
    # location / { proxy_pass http://127.0.0.1:3000; ... }

    # NOTE: some nginx versions mangle query strings in auth_request
    # (the ? arrives URL-encoded at the backend). So each terminal gets its
    # OWN auth location with a static X-Slot header — generated by install.sh:
    #   location = /dash-auth-u-c1 {
    #       internal;
    #       proxy_pass http://127.0.0.1:8420/api/auth-check;
    #       proxy_pass_request_body off;
    #       proxy_set_header Content-Length "";
    #       proxy_set_header Cookie $http_cookie;
    #       proxy_set_header X-Target term;
    #       proxy_set_header X-Slot u-c1;
    #   }
    #   location /term/u-c1/ {
    #       auth_request /dash-auth-u-c1;
    #       proxy_pass http://127.0.0.1:7681/;
    #       proxy_http_version 1.1;
    #       proxy_set_header Upgrade $http_upgrade;
    #       proxy_set_header Connection "upgrade";
    #   }

    location /dash/ {
        proxy_pass http://127.0.0.1:8420/;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # /term/<slot>/ -> per-slot ttyd blocks (generated by install.sh).
    include /etc/nginx/dachboard/terms.conf;
}
