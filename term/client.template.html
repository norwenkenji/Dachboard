<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>shell · dachboard</title>
<style>
/*__XTERM_CSS__*/
</style>
<style>
html, body { height: 100%; }
body { margin: 0; background: #0b0e0c; overflow: hidden; }
#term { position: fixed; inset: 0; padding: 10px 6px 10px 12px; box-sizing: border-box; }
#term .xterm-viewport { overflow-y: scroll !important; scrollbar-width: thin;
  scrollbar-color: #2e3238 transparent; background-color: #0b0e0c !important; }
#term .xterm-viewport::-webkit-scrollbar { width: 10px; }
#term .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
#term .xterm-viewport::-webkit-scrollbar-thumb { background: #2e3238; border-radius: 6px;
  border: 2px solid #0b0e0c; }
#term .xterm-viewport::-webkit-scrollbar-thumb:hover { background: #3d434b; }
#term .xterm-screen { background-color: #0b0e0c !important; }
#status { position: fixed; left: 12px; bottom: 10px; z-index: 10;
  font: 12px system-ui, sans-serif; color: #9aa39a;
  background: rgba(20, 35, 26, 0.92); border: 1px solid #2a4433;
  border-radius: 6px; padding: 4px 10px; }
#status.hidden { display: none; }
</style>
</head>
<body>
<div id="term"></div>
<div id="status" class="hidden"></div>
<script>
/*__XTERM_JS__*/
</script>
<script>
/*__FIT_JS__*/
</script>
<script>
(function () {
  "use strict";
  var statusEl = document.getElementById("status");
  function setStatus(msg) {
    if (!msg) { statusEl.classList.add("hidden"); return; }
    statusEl.textContent = msg;
    statusEl.classList.remove("hidden");
  }
  if (!window.Terminal) {
    setStatus("terminal engine missing");
    return;
  }
  var term = new Terminal({
    rendererType: "canvas",
    scrollback: 5000,
    fontSize: 14,
    fontFamily: "ui-monospace,SFMono-Regular,Menlo,Consolas,monospace",
    theme: {
      background: "#0b0e0c",
      foreground: "#e8e9eb",
      cursor: "#5cb98b",
      cursorAccent: "#0b0e0c",
      selectionBackground: "rgba(92,185,139,0.3)"
    }
  });
  var fit = null;
  if (window.FitAddon) {
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
  }
  term.open(document.getElementById("term"));
  if (fit) { try { fit.fit(); } catch (e) { /* ignore */ } }
  term.focus();
  document.getElementById("term").addEventListener("click", function () { term.focus(); });

  var enc = new TextEncoder(), dec = new TextDecoder();
  var base = location.pathname.replace(/\/?$/, "/");
  var wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + base + "ws";
  var ws = null, retry = 0, opened = false;

  function sendResize() {
    if (ws && ws.readyState === 1) {
      ws.send(enc.encode("1" + JSON.stringify({ columns: term.cols, rows: term.rows })));
    }
  }
  term.onResize(sendResize);
  term.onData(function (d) {
    if (ws && ws.readyState === 1) ws.send(enc.encode("0" + d));
  });
  window.addEventListener("resize", function () { if (fit) { try { fit.fit(); } catch (e) {} } });

  function connect() {
    setStatus("connecting…");
    try { ws = new WebSocket(wsUrl, ["tty"]); } catch (e) { later(); return; }
    ws.binaryType = "arraybuffer";
    ws.onopen = function () {
      retry = 0;
      setStatus(null);
      ws.send(enc.encode(JSON.stringify({ AuthToken: "", columns: term.cols, rows: term.rows })));
      if (opened) { term.reset(); }
      opened = true;
    };
    ws.onmessage = function (ev) {
      var b = new Uint8Array(ev.data);
      if (!b.length) return;
      var cmd = String.fromCharCode(b[0]);
      if (cmd === "0") term.write(b.slice(1));
      else if (cmd === "1") document.title = dec.decode(b.slice(1)) + " · dachboard";
    };
    var closed = function () {
      setStatus("reconnecting…");
      later();
    };
    ws.onclose = closed;
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  function later() {
    retry++;
    setTimeout(connect, Math.min(1000 * retry, 5000));
  }
  connect();
})();
</script>
</body>
</html>
