# tmux profile for dachboard shells.
# - status off: dashboard already has its own green toolbar
# - mouse on: wheel scrolls tmux history instead of sending arrow keys
# - login bash: full prompt (user@host) like a normal terminal
set -g status off
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-*:Tc"
set -g history-limit 5000
set -g escape-time 10
